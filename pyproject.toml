[project]
name = "icuvrapp"
version = "0.1.0"
description = "Python application for VR-related research with heart rate tracking"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bleak>=3.0.2",
    "customtkinter>=6.0.0",
    "fpdf>=1.7.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.2",
    "pyzipper>=0.4.0",
]
[project.scripts]
icuvrapp = "icuvrapp.main:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "prek>=0.4.12",
    "ruff>=0.16.1",
]

[tool.ruff.lint]
ignore=["BLE001"]
